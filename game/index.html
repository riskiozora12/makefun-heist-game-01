<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night Vault — The Meridian Heist</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05070f;
    min-height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
  }
  canvas {
    display: block;
    width: min(1280px, 100vw);
    height: auto;
    background: #101527;
  }
  #status {
    color: #93a0bd;
    font-size: 14px;
    margin: 10px 0 0;
    min-height: 20px;
  }
</style>
</head>
<body>
<main>
  <canvas id="game" width="1280" height="720"></canvas>
  <p id="status" aria-live="polite"></p>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
